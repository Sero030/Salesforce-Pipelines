name: DEV Incremental Validate

on:
  pull_request:
    branches:
      -   release/dev
    paths:
      -   "force-app/**"

jobs:
  validation:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Self Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20
          
      - name: Git Log
        run: git log --oneline
        
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          
      - name: Install OCLIF Dependencies
        run: |
          npm install --global oclif
          
      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global
          
      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta
          
      - name: Authorize Salesforce Org
        run: |
          sf org login sfdx-url "force://PlatformCLI::5Aep8618MtpGySpPxiQlkboHwUOYTgbtW4JGjmW_sm8lZ2Bfv1hA1VXyR4HqBKHSFexbT_J7QOgsuP1J4LHHUH0@orgfarm-62244b74f1-dev-ed.develop.my.salesforce.com"


      - name: Get delta
        run: |
          sfdx sgd:source:delta --to "HEAD" --from "${{ vars.DEV_STARTCOMMIT }}"\
          --output-dir "."\
          --source-dir force-app/
      - name: Package.xml
        run: |
          cat package/package.xml
      - name: Destructive.xml
        run: |
          cat destructiveChanges/destructiveChanges.xml
      - name: Validation
        run: |
          sf project deploy start\
          --manifest package/package.xml\
          --post-destructive-changes destructiveChanges/destructiveChanges.xml\
          --test-level ${{ vars.DEV_TESTLEVEL }}\
          -o ${{ vars.DEV_USERNAME }}\
          --dry-run 
